name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install build .
      - run: make release-build RELEASE_TAG="${GITHUB_REF_NAME}"
      - run: git diff --exit-code -- src/zev/assets/zev-bridge.xpi
      # v4 caching is opt-in; this project has no Node package manager or cache.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # zizmor: ignore[cache-poisoning]
        with:
          node-version: "22"
      - run: make test
      - run: python -m build
      - run: python scripts/verify_wheel_xpi.py dist/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: |
            dist/*
            zotero-plugin/dist/zev-bridge.xpi
            zotero-plugin/dist/zev-bridge-updates.json

  github-release:
    needs: build-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            dist/* \
            zotero-plugin/dist/zev-bridge.xpi \
            zotero-plugin/dist/zev-bridge-updates.json
